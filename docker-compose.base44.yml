services:
  web:
    image: golang:1.23
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "3000:3000"
    command: ["go", "run", "./showcase/"]
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/3000' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
